name: eurobank

services:
  # ---------------------------------------------------------------------------------------------------------
  # PostgreSQL com replicação lógica (wal_level=logical): é daqui que o Debezium lê as mudanças (WAL).
  # Um database por contexto: eurobank_contas (contas + outbox), eurobank_extrato (projeção),
  # eurobank_transferencias (sagas + outbox), eurobank_notificacoes (e-mails enviados) e os dos simuladores
  # (eurobank_banco_externo e eurobank_cambio).
  # ---------------------------------------------------------------------------------------------------------
  postgres:
    image: postgres:18.6
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: eurobank_contas
    ports:
      - "${POSTGRES_PORTA_HOST:-5434}:5432"
    volumes:
      - postgres-dados:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d eurobank_contas"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Cria os databases que faltarem (idempotente, roda a cada "up", inclusive num volume antigo). Precisa
  # terminar antes do registro dos conectores: o Debezium não conecta num database que não existe.
  postgres-init:
    image: postgres:18.6
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./infra/postgres:/infra:ro
    entrypoint: ["/bin/sh", "/infra/criar-bancos.sh"]
    restart: "no"

  # ---------------------------------------------------------------------------------------------------------
  # Kafka em modo KRaft (sem Zookeeper), um único nó que é broker e controller.
  # Listener INTERNO (kafka:29092) para os containers; EXTERNO (localhost:9092) para apps rodando no host.
  # ---------------------------------------------------------------------------------------------------------
  kafka:
    image: apache/kafka:4.4.0
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "ZXVyb2JhbmstbGFiLWthZmth"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNO://:29092,EXTERNO://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNO://kafka:29092,EXTERNO://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNO:PLAINTEXT,EXTERNO:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNO
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    # Sem volume: os dados do Kafka (inclusive offsets do Connect) somem quando o container é recriado.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Cria os tópicos do laboratório com 3 partições antes de alguém publicar neles.
  kafka-init:
    image: apache/kafka:4.4.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/kafka:/infra:ro
    entrypoint: ["/bin/sh", "/infra/criar-topicos.sh"]
    restart: "no"

  # ---------------------------------------------------------------------------------------------------------
  # Kafka Connect com os conectores do Debezium. Conversores JSON sem schema embutido.
  # ---------------------------------------------------------------------------------------------------------
  connect:
    image: quay.io/debezium/connect:3.6.3.Final
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: eurobank-connect
      CONFIG_STORAGE_TOPIC: eurobank_connect_configs
      OFFSET_STORAGE_TOPIC: eurobank_connect_offsets
      STATUS_STORAGE_TOPIC: eurobank_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/connectors > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40

  # Registra os conectores (outbox e CDC bruto) ANTES de a API de Contas subir: assim o replication slot já
  # existe quando as migrations e o seed gravam, e nada se perde (a outbox usa snapshot.mode=no_data).
  # Como as tabelas ainda não existem nessa hora, as publications são FOR ALL TABLES (all_tables) e o
  # Debezium filtra pelo table.include.list.
  connect-init:
    image: curlimages/curl:8.23.0
    depends_on:
      connect:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres-init:
        condition: service_completed_successfully
    volumes:
      - ./infra/connect:/infra:ro
    entrypoint: ["/bin/sh", "/infra/registrar-conectores.sh"]
    restart: "no"

  # UI: tópicos, mensagens (com headers), consumer groups e os conectores do Kafka Connect.
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: eurobank
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
      DYNAMIC_CONFIG_ENABLED: "true"

  # Traces OpenTelemetry (OTLP gRPC 4317 / HTTP 4318), UI em http://localhost:16686.
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  # ---------------------------------------------------------------------------------------------------------
  # Aplicações .NET
  # ---------------------------------------------------------------------------------------------------------
  contas-api:
    build:
      context: .
      dockerfile: src/Contas/EuroBank.Contas.Api/Dockerfile
    ports:
      - "5100:8080"
    depends_on:
      postgres:
        condition: service_healthy
      connect-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Contas: "Host=postgres;Port=5432;Database=eurobank_contas;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Seguranca__ApiKey: ${CONTAS_API_KEY}
      # true: insere e apaga a linha da outbox na mesma transação (o evento sai mesmo assim, pelo WAL).
      Outbox__ApagarAposGravar: ${OUTBOX_APAGAR_APOS_GRAVAR:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Executa os comandos das sagas de Transferencias (eurobank.contas.comandos) e responde pela outbox.
  # Espera a API de Contas ficar saudável, porque é ela que aplica as migrations do banco de Contas.
  contas-worker:
    build:
      context: .
      dockerfile: src/Contas/EuroBank.Contas.Worker/Dockerfile
    depends_on:
      contas-api:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Contas: "Host=postgres;Port=5432;Database=eurobank_contas;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Kafka__BootstrapServers: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Consumidor do Kafka (consumer group eurobank-extrato) + API de consulta do extrato.
  # Para escalar para 3 instâncias (uma por partição), use o override com faixa de portas:
  #   docker compose -f docker-compose.yml -f docker-compose.escala.yml up -d --scale extrato-worker=3
  extrato-worker:
    build:
      context: .
      dockerfile: src/Extrato/EuroBank.Extrato.Worker/Dockerfile
    ports:
      - "5200:8080"
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Extrato: "Host=postgres;Port=5432;Database=eurobank_extrato;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Seguranca__ApiKey: ${EXTRATO_API_KEY}
      Kafka__BootstrapServers: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Orquestrador das sagas de transferência: recebe os pedidos (Idempotency-Key obrigatório) e começa a saga
  # na hora; os comandos saem pela outbox de eurobank_transferencias (conector eurobank-transferencias-outbox).
  transferencias-api:
    build:
      context: .
      dockerfile: src/Transferencias/EuroBank.Transferencias.Api/Dockerfile
    ports:
      - "5300:8080"
    depends_on:
      connect-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Transferencias: "Host=postgres;Port=5432;Database=eurobank_transferencias;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Seguranca__ApiKey: ${TRANSFERENCIAS_API_KEY}
      # false desliga o horário de corte SEPA (transferências em EUR depois das 16:00 UTC ou no fim de semana
      # ficam para o próximo dia útil às 08:00 UTC).
      Sepa__AplicarHorarioDeCorte: ${SEPA_HORARIO_DE_CORTE:-true}
      Saga__PrazoDebito: ${SAGA_PRAZO_DEBITO:-00:00:30}
      Saga__PrazoLiquidacao: ${SAGA_PRAZO_LIQUIDACAO:-00:00:30}
      Saga__PrazoConsulta: ${SAGA_PRAZO_CONSULTA:-00:00:15}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Conduz as sagas depois do primeiro passo: respostas de Contas e do banco externo (inbox durável no banco
  # de Transferencias) e a varredura de agendadas e prazos (FOR UPDATE SKIP LOCKED: pode escalar).
  # Espera a API ficar saudável, porque é ela que aplica as migrations.
  transferencias-worker:
    build:
      context: .
      dockerfile: src/Transferencias/EuroBank.Transferencias.Worker/Dockerfile
    depends_on:
      transferencias-api:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Transferencias: "Host=postgres;Port=5432;Database=eurobank_transferencias;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Kafka__BootstrapServers: kafka:29092
      Saga__PrazoDebito: ${SAGA_PRAZO_DEBITO:-00:00:30}
      Saga__PrazoLiquidacao: ${SAGA_PRAZO_LIQUIDACAO:-00:00:30}
      Saga__PrazoConsulta: ${SAGA_PRAZO_CONSULTA:-00:00:15}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  # E-mail em pt-BR para quem pediu (emailNotificacao) a partir dos eventos finais das sagas
  # (eurobank.transferencias.eventos), com inbox durável e a tabela notificacoes (chave = id do evento) no database
  # eurobank_notificacoes. SMTP fora do ar: novas tentativas em 5 s, 30 s e 2 min, depois dead letter; a saga não
  # é afetada.
  notificacoes-worker:
    build:
      context: .
      dockerfile: src/Notificacoes/EuroBank.Notificacoes.Worker/Dockerfile
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Notificacoes: "Host=postgres;Port=5432;Database=eurobank_notificacoes;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Kafka__BootstrapServers: kafka:29092
      Smtp__Host: mailpit
      Smtp__Porta: "1025"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Caixa de e-mail do laboratório: SMTP na 1025 (sem TLS e sem autenticação) e UI em http://localhost:8025.
  # A porta SMTP também fica no host para o worker de notificações rodar pela IDE. As duas portas do host mudam
  # por MAILPIT_PORTA_UI e MAILPIT_PORTA_SMTP (outro projeto com Mailpit costuma ocupar 8025 e 1025).
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "${MAILPIT_PORTA_UI:-8025}:8025"
      - "${MAILPIT_PORTA_SMTP:-1025}:1025"
    environment:
      # O padrão guarda só 500 mensagens; a carga do k6 pode passar disso.
      MP_MAX_MESSAGES: "5000"

  # ---------------------------------------------------------------------------------------------------------
  # Simuladores de sistemas de fora do EuroBank (Confluent.Kafka e Npgsql puros, sem Wolverine e sem EF).
  # ---------------------------------------------------------------------------------------------------------

  # Rede SEPA de mentira: liquida, recusa, atrasa ou some conforme o final do IBAN de destino.
  # Database próprio (eurobank_banco_externo), criado pelo simulador na primeira subida.
  banco-externo-simulador:
    build:
      context: .
      dockerfile: src/Simuladores/EuroBank.Simuladores.BancoExterno/Dockerfile
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__BancoExterno: "Host=postgres;Port=5432;Database=eurobank_banco_externo;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Kafka__BootstrapServers: kafka:29092
      BancoExterno__LatenciaMs: ${BANCO_EXTERNO_LATENCIA_MS:-1000}
      BancoExterno__TaxaRecusa: ${BANCO_EXTERNO_TAXA_RECUSA:-0}
      BancoExterno__TaxaSilencio: ${BANCO_EXTERNO_TAXA_SILENCIO:-0}
      BancoExterno__AtrasoFinal95Segundos: ${BANCO_EXTERNO_ATRASO_95:-300}
      BancoExterno__AtrasoDevolucaoSegundos: ${BANCO_EXTERNO_ATRASO_DEVOLUCAO:-10}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Provedor de cotações de mentira: base EUR (1,08 USD, 0,86 GBP, 5,90 BRL), spread de 1%, cotação travada por
  # 10 minutos e o par BRL/GBP indisponível. Database próprio (eurobank_cambio).
  cambio-simulador:
    build:
      context: .
      dockerfile: src/Simuladores/EuroBank.Simuladores.Cambio/Dockerfile
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Cambio: "Host=postgres;Port=5432;Database=eurobank_cambio;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Kafka__BootstrapServers: kafka:29092
      Cambio__LatenciaMs: ${CAMBIO_LATENCIA_MS:-500}
      Cambio__ValidadeMinutos: ${CAMBIO_VALIDADE_MINUTOS:-10}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Gerador de carga sob demanda (não sobe no "up"). Operações de Contas e sagas misturadas; no fim confere que
  # todas as sagas terminaram e que nenhum dinheiro sumiu. Precisa do corte SEPA desligado na API de Transferencias:
  #   SEPA_HORARIO_DE_CORTE=false docker compose up -d transferencias-api
  #   docker compose --profile carga run --rm k6
  #   K6_VUS=20 K6_DURACAO=2m docker compose --profile carga run --rm k6
  #   K6_FINAIS_LENTOS=true docker compose --profile carga run --rm k6   (inclui os finais 98 e 95)
  k6:
    image: grafana/k6:2.3.0
    profiles: ["carga"]
    depends_on:
      contas-api:
        condition: service_healthy
      extrato-worker:
        condition: service_healthy
      transferencias-api:
        condition: service_healthy
      transferencias-worker:
        condition: service_healthy
    environment:
      API_CONTAS: http://contas-api:8080
      API_EXTRATO: http://extrato-worker:8080
      API_TRANSFERENCIAS: http://transferencias-api:8080
      API_KEY_CONTAS: ${CONTAS_API_KEY}
      API_KEY_EXTRATO: ${EXTRATO_API_KEY}
      API_KEY_TRANSFERENCIAS: ${TRANSFERENCIAS_API_KEY}
      VUS: ${K6_VUS:-10}
      DURACAO: ${K6_DURACAO:-1m}
      CONTAS: ${K6_CONTAS:-10}
      FINAIS_LENTOS: ${K6_FINAIS_LENTOS:-false}
    volumes:
      - ./infra/k6:/scripts:ro
    command: ["run", "/scripts/carga.js"]

volumes:
  postgres-dados:
