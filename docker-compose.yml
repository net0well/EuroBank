name: eurobank

services:
  # ---------------------------------------------------------------------------------------------------------
  # PostgreSQL com replicação lógica (wal_level=logical): é daqui que o Debezium lê as mudanças (WAL).
  # Databases: eurobank_contas (contas + outbox) e eurobank_extrato (projeção do contexto Extrato).
  # ---------------------------------------------------------------------------------------------------------
  postgres:
    image: postgres:18.6
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: eurobank_contas
    ports:
      - "${POSTGRES_PORTA_HOST:-5434}:5432"
    volumes:
      - postgres-dados:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d eurobank_contas"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------------------------------------------------
  # Kafka em modo KRaft (sem Zookeeper), um único nó que é broker e controller.
  # Listener INTERNO (kafka:29092) para os containers; EXTERNO (localhost:9092) para apps rodando no host.
  # ---------------------------------------------------------------------------------------------------------
  kafka:
    image: apache/kafka:4.4.0
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "ZXVyb2JhbmstbGFiLWthZmth"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNO://:29092,EXTERNO://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNO://kafka:29092,EXTERNO://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNO:PLAINTEXT,EXTERNO:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNO
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    # Sem volume: os dados do Kafka (inclusive offsets do Connect) somem quando o container é recriado.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Cria eurobank.contas.eventos com 3 partições antes de o Debezium publicar nele.
  kafka-init:
    image: apache/kafka:4.4.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/kafka:/infra:ro
    entrypoint: ["/bin/sh", "/infra/criar-topicos.sh"]
    restart: "no"

  # ---------------------------------------------------------------------------------------------------------
  # Kafka Connect com os conectores do Debezium. Conversores JSON sem schema embutido.
  # ---------------------------------------------------------------------------------------------------------
  connect:
    image: quay.io/debezium/connect:3.6.3.Final
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: eurobank-connect
      CONFIG_STORAGE_TOPIC: eurobank_connect_configs
      OFFSET_STORAGE_TOPIC: eurobank_connect_offsets
      STATUS_STORAGE_TOPIC: eurobank_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/connectors > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40

  # Registra os conectores (outbox e CDC bruto) ANTES de a API de Contas subir: assim o replication slot já
  # existe quando as migrations e o seed gravam, e nada se perde (a outbox usa snapshot.mode=no_data).
  # Como as tabelas ainda não existem nessa hora, as publications são FOR ALL TABLES (all_tables) e o
  # Debezium filtra pelo table.include.list.
  connect-init:
    image: curlimages/curl:8.23.0
    depends_on:
      connect:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./infra/connect:/infra:ro
    entrypoint: ["/bin/sh", "/infra/registrar-conectores.sh"]
    restart: "no"

  # UI: tópicos, mensagens (com headers), consumer groups e os conectores do Kafka Connect.
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: eurobank
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
      DYNAMIC_CONFIG_ENABLED: "true"

  # Traces OpenTelemetry (OTLP gRPC 4317 / HTTP 4318), UI em http://localhost:16686.
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  # ---------------------------------------------------------------------------------------------------------
  # Aplicações .NET
  # ---------------------------------------------------------------------------------------------------------
  contas-api:
    build:
      context: .
      dockerfile: src/Contas/EuroBank.Contas.Api/Dockerfile
    ports:
      - "5100:8080"
    depends_on:
      postgres:
        condition: service_healthy
      connect-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Contas: "Host=postgres;Port=5432;Database=eurobank_contas;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Consumidor do Kafka (consumer group eurobank-extrato) + API de consulta do extrato.
  # Para escalar para 3 instâncias (uma por partição), use o override com faixa de portas:
  #   docker compose -f docker-compose.yml -f docker-compose.escala.yml up -d --scale extrato-worker=3
  extrato-worker:
    build:
      context: .
      dockerfile: src/Extrato/EuroBank.Extrato.Worker/Dockerfile
    ports:
      - "5200:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Extrato: "Host=postgres;Port=5432;Database=eurobank_extrato;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Kafka__BootstrapServers: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  postgres-dados:
