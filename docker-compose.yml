name: eurobank

# Telemetria das aplicações .NET: traces no Jaeger (OTLP gRPC) e métricas no Prometheus do profile metricas (o receptor
# OTLP dele só fala http/protobuf), a cada 5 s. Sem o profile, o envio das métricas falha em silêncio e nada mais muda.
x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://prometheus:9090/api/v1/otlp/v1/metrics
  OTEL_EXPORTER_OTLP_METRICS_PROTOCOL: http/protobuf
  OTEL_METRIC_EXPORT_INTERVAL: "5000"

services:
  # ---------------------------------------------------------------------------------------------------------
  # PostgreSQL com replicação lógica (wal_level=logical): é daqui que o Debezium lê as mudanças (WAL).
  # Um database por contexto: eurobank_contas (contas + outbox), eurobank_extrato (projeção),
  # eurobank_transferencias (sagas + outbox), eurobank_notificacoes (e-mails enviados), eurobank_antifraude
  # (análises, casos, regras + outbox) e os dos simuladores (eurobank_banco_externo e eurobank_cambio).
  # ---------------------------------------------------------------------------------------------------------
  postgres:
    image: postgres:18.6
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: eurobank_contas
    ports:
      - "${POSTGRES_PORTA_HOST:-5434}:5432"
    volumes:
      - postgres-dados:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d eurobank_contas"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Cria os databases que faltarem (idempotente, roda a cada "up", inclusive num volume antigo). Precisa
  # terminar antes do registro dos conectores: o Debezium não conecta num database que não existe.
  postgres-init:
    image: postgres:18.6
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./infra/postgres:/infra:ro
    entrypoint: ["/bin/sh", "/infra/criar-bancos.sh"]
    restart: "no"

  # ---------------------------------------------------------------------------------------------------------
  # Kafka em modo KRaft (sem Zookeeper), um único nó que é broker e controller.
  # Listener INTERNO (kafka:29092) para os containers; EXTERNO (localhost:9092) para apps rodando no host.
  # ---------------------------------------------------------------------------------------------------------
  kafka:
    image: apache/kafka:4.4.0
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "ZXVyb2JhbmstbGFiLWthZmth"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNO://:29092,EXTERNO://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNO://kafka:29092,EXTERNO://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNO:PLAINTEXT,EXTERNO:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNO
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    # Sem volume: os dados do Kafka (inclusive offsets do Connect) somem quando o container é recriado.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Cria os tópicos do laboratório com 3 partições antes de alguém publicar neles.
  kafka-init:
    image: apache/kafka:4.4.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/kafka:/infra:ro
    entrypoint: ["/bin/sh", "/infra/criar-topicos.sh"]
    restart: "no"

  # ---------------------------------------------------------------------------------------------------------
  # Kafka Connect com os conectores do Debezium. Conversores JSON sem schema embutido.
  # ---------------------------------------------------------------------------------------------------------
  connect:
    image: quay.io/debezium/connect:3.6.3.Final
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: eurobank-connect
      CONFIG_STORAGE_TOPIC: eurobank_connect_configs
      OFFSET_STORAGE_TOPIC: eurobank_connect_offsets
      STATUS_STORAGE_TOPIC: eurobank_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/connectors > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40

  # Registra os conectores (outbox e CDC bruto) ANTES de a API de Contas subir: assim o replication slot já
  # existe quando as migrations e o seed gravam, e nada se perde (a outbox usa snapshot.mode=no_data).
  # Como as tabelas ainda não existem nessa hora, as publications são FOR ALL TABLES (all_tables) e o
  # Debezium filtra pelo table.include.list.
  connect-init:
    image: curlimages/curl:8.23.0
    depends_on:
      connect:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres-init:
        condition: service_completed_successfully
    volumes:
      - ./infra/connect:/infra:ro
    entrypoint: ["/bin/sh", "/infra/registrar-conectores.sh"]
    restart: "no"

  # UI: tópicos, mensagens (com headers), consumer groups e os conectores do Kafka Connect.
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: eurobank
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
      DYNAMIC_CONFIG_ENABLED: "true"

  # Traces OpenTelemetry (OTLP gRPC 4317 / HTTP 4318), UI em http://localhost:16686.
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  # ---------------------------------------------------------------------------------------------------------
  # Aplicações .NET
  # ---------------------------------------------------------------------------------------------------------
  contas-api:
    build:
      context: .
      dockerfile: src/Contas/EuroBank.Contas.Api/Dockerfile
    ports:
      - "5100:8080"
    depends_on:
      postgres:
        condition: service_healthy
      connect-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      antifraude-api:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Contas: "Host=postgres;Port=5432;Database=eurobank_contas;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Seguranca__ApiKey: ${CONTAS_API_KEY}
      # Saque e transferência interna passam pelo antifraude (gRPC h2c): recusa ou revisão, 422 antifraude_revisao;
      # sem resposta, 422 antifraude_indisponivel. false volta ao fluxo sem antifraude (a carga do k6 usa assim).
      Antifraude__Ativo: ${CONTAS_ANALISE_RISCO:-true}
      Antifraude__Endereco: http://antifraude-api:8081
      Antifraude__ApiKey: ${ANTIFRAUDE_API_KEY}
      ConnectionStrings__Redis: "${REDIS_CONEXAO:-redis:6379}"
      # Rate limit por API key (janela deslizante de 1 s no Redis; 429 com Retry-After; com o Redis fora, deixa passar).
      LimiteRequisicoes__PorSegundo: ${RATE_LIMIT_POR_SEGUNDO:-100}
      # true: insere e apaga a linha da outbox na mesma transação (o evento sai mesmo assim, pelo WAL).
      Outbox__ApagarAposGravar: ${OUTBOX_APAGAR_APOS_GRAVAR:-false}
      <<: *otel
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Executa os comandos das sagas de Transferencias (eurobank.contas.comandos) e responde pela outbox.
  # Espera a API de Contas ficar saudável, porque é ela que aplica as migrations do banco de Contas.
  contas-worker:
    build:
      context: .
      dockerfile: src/Contas/EuroBank.Contas.Worker/Dockerfile
    depends_on:
      contas-api:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Contas: "Host=postgres;Port=5432;Database=eurobank_contas;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Kafka__BootstrapServers: kafka:29092
      <<: *otel
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Consumidor do Kafka (consumer group eurobank-extrato) + API de consulta do extrato, com o resumo e a primeira
  # página de cada conta no Redis conforme EXTRATO_CACHE_ESTRATEGIA (com o Redis fora, tudo segue pelo Postgres).
  # Para escalar para 3 instâncias (uma por partição), use o override com faixa de portas:
  #   docker compose -f docker-compose.yml -f docker-compose.escala.yml up -d --scale extrato-worker=3
  extrato-worker:
    build:
      context: .
      dockerfile: src/Extrato/EuroBank.Extrato.Worker/Dockerfile
    ports:
      - "5200:8080"
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Extrato: "Host=postgres;Port=5432;Database=eurobank_extrato;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "${REDIS_CONEXAO:-redis:6379}"
      # Nenhuma, CacheAside, WriteThrough ou WriteBehind (resumo e primeira página de cada conta no Redis).
      Cache__Estrategia: ${EXTRATO_CACHE_ESTRATEGIA:-WriteThrough}
      Seguranca__ApiKey: ${EXTRATO_API_KEY}
      # Rate limit por API key (janela deslizante de 1 s no Redis; 429 com Retry-After; com o Redis fora, deixa passar).
      LimiteRequisicoes__PorSegundo: ${RATE_LIMIT_POR_SEGUNDO:-100}
      Kafka__BootstrapServers: kafka:29092
      <<: *otel
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Orquestrador das sagas de transferência: recebe os pedidos (Idempotency-Key obrigatório) e começa a saga
  # na hora; os comandos saem pela outbox de eurobank_transferencias (conector eurobank-transferencias-outbox).
  transferencias-api:
    build:
      context: .
      dockerfile: src/Transferencias/EuroBank.Transferencias.Api/Dockerfile
    ports:
      - "5300:8080"
    depends_on:
      connect-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Transferencias: "Host=postgres;Port=5432;Database=eurobank_transferencias;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      # Idempotency-Key reservada no Redis antes da constraint do Postgres (com o Redis fora, só a constraint).
      ConnectionStrings__Redis: "${REDIS_CONEXAO:-redis:6379}"
      Seguranca__ApiKey: ${TRANSFERENCIAS_API_KEY}
      # Rate limit por API key (janela deslizante de 1 s no Redis; 429 com Retry-After; com o Redis fora, deixa passar).
      LimiteRequisicoes__PorSegundo: ${RATE_LIMIT_POR_SEGUNDO:-100}
      # false desliga o horário de corte SEPA (transferências em EUR depois das 16:00 UTC ou no fim de semana
      # ficam para o próximo dia útil às 08:00 UTC).
      Sepa__AplicarHorarioDeCorte: ${SEPA_HORARIO_DE_CORTE:-true}
      Saga__PrazoDebito: ${SAGA_PRAZO_DEBITO:-00:00:30}
      Saga__PrazoLiquidacao: ${SAGA_PRAZO_LIQUIDACAO:-00:00:30}
      Saga__PrazoConsulta: ${SAGA_PRAZO_CONSULTA:-00:00:15}
      # Igual na API e no worker: os dois começam sagas. false volta ao fluxo sem antifraude.
      Saga__AnaliseRiscoAtiva: ${SAGA_ANALISE_RISCO:-true}
      <<: *otel
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Conduz as sagas depois do primeiro passo: respostas de Contas, do câmbio e do banco externo e decisões do
  # antifraude (inbox durável no banco de Transferencias) e a varredura de agendadas, análises de risco (gRPC no
  # antifraude) e prazos (FOR UPDATE SKIP LOCKED: pode escalar).
  # Espera a API ficar saudável, porque é ela que aplica as migrations, e o antifraude, para as primeiras
  # transferências não serem recusadas por ele ainda estar subindo.
  transferencias-worker:
    build:
      context: .
      dockerfile: src/Transferencias/EuroBank.Transferencias.Worker/Dockerfile
    depends_on:
      transferencias-api:
        condition: service_healthy
      antifraude-api:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Transferencias: "Host=postgres;Port=5432;Database=eurobank_transferencias;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Kafka__BootstrapServers: kafka:29092
      Saga__PrazoDebito: ${SAGA_PRAZO_DEBITO:-00:00:30}
      Saga__PrazoLiquidacao: ${SAGA_PRAZO_LIQUIDACAO:-00:00:30}
      Saga__PrazoConsulta: ${SAGA_PRAZO_CONSULTA:-00:00:15}
      Saga__AnaliseRiscoAtiva: ${SAGA_ANALISE_RISCO:-true}
      # gRPC em h2c na porta interna do antifraude. Estrategia: Retry, Hedging ou Nenhuma.
      Antifraude__Endereco: http://antifraude-api:8081
      Antifraude__ApiKey: ${ANTIFRAUDE_API_KEY}
      Antifraude__Estrategia: ${ANTIFRAUDE_ESTRATEGIA:-Retry}
      <<: *otel
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ---------------------------------------------------------------------------------------------------------
  # Antifraude
  # ---------------------------------------------------------------------------------------------------------

  # Perfil de comportamento das contas, cache do extrato, Idempotency-Key, cotações e rate limit. Sem volume nem
  # persistência: o que importa se reconstrói pelos eventos. Porta do host configurável (REDIS_PORTA_HOST). As
  # aplicações conectam por REDIS_CONEXAO (padrão: este Redis direto; com o profile ha, os sentinels). Ele se anuncia
  # pelo nome, para voltar como réplica depois de um failover.
  redis:
    image: redis:8.10.3
    command: ["redis-server", "--save", "", "--appendonly", "no", "--replica-announce-ip", "redis"]
    # Só os nomes da rede do compose: o nome de um container parado falha na hora, em vez de esperar ~8 s pelo DNS do
    # host, que trava o Redis (a réplica resolve o primário a cada reconexão; o sentinel entra em TILT e não elege).
    dns: ["127.0.0.1"]
    ports:
      - "${REDIS_PORTA_HOST:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Alta disponibilidade sob demanda (profile ha): duas réplicas do redis e três sentinels, que elegem uma réplica
  # como primária quando o primário cai (quórum 2, 5 s sem resposta). As aplicações conectam pelos sentinels:
  #   export REDIS_CONEXAO="redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379,serviceName=eurobank"
  #   docker compose --profile ha up -d
  # A replicação é assíncrona: o que foi escrito no primário e ainda não chegou à réplica se perde no failover.
  redis-replica-1:
    image: redis:8.10.3
    profiles: ["ha"]
    command: ["redis-server", "--save", "", "--appendonly", "no", "--replicaof", "redis", "6379", "--replica-announce-ip", "redis-replica-1"]
    dns: ["127.0.0.1"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-replica-2:
    image: redis:8.10.3
    profiles: ["ha"]
    command: ["redis-server", "--save", "", "--appendonly", "no", "--replicaof", "redis", "6379", "--replica-announce-ip", "redis-replica-2"]
    dns: ["127.0.0.1"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-sentinel-1: &sentinel
    image: redis:8.10.3
    profiles: ["ha"]
    # O sentinel reescreve o próprio arquivo de configuração: ele é gerado na subida, num lugar gravável.
    command:
      - sh
      - -c
      - |
        cat > /tmp/sentinel.conf <<'CONF'
        port 26379
        sentinel resolve-hostnames yes
        sentinel announce-hostnames yes
        sentinel monitor eurobank redis 6379 2
        sentinel down-after-milliseconds eurobank 5000
        sentinel failover-timeout eurobank 15000
        sentinel parallel-syncs eurobank 1
        CONF
        exec redis-server /tmp/sentinel.conf --sentinel
    dns: ["127.0.0.1"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-sentinel-2: *sentinel

  redis-sentinel-3: *sentinel

  # UI do Redis em http://localhost:5540, já com a conexão "eurobank" (redis:6379): veja as chaves
  # antifraude:{conta}:perfil, :saidas e :beneficiarios.
  redisinsight:
    image: redis/redisinsight:3.8.0
    ports:
      - "${REDISINSIGHT_PORTA:-5540}:5540"
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
      RI_REDIS_ALIAS: eurobank
    depends_on:
      redis:
        condition: service_healthy

  # O AntifraudeService: gRPC na 5410 (HTTP/2 sem TLS, com reflection e grpc.health.v1) e, na 5400 (HTTP/1.1), o mesmo
  # serviço por JSON transcoding, o REST do analista e o Swagger. Aplica as migrations e os dados iniciais ao subir.
  antifraude-api:
    build:
      context: .
      dockerfile: src/Antifraude/EuroBank.Antifraude.Api/Dockerfile
    ports:
      - "5400:8080"
      - "5410:8081"
    depends_on:
      connect-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Kestrel__Endpoints__Rest__Url: http://+:8080
      Kestrel__Endpoints__Grpc__Url: http://+:8081
      ConnectionStrings__Antifraude: "Host=postgres;Port=5432;Database=eurobank_antifraude;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "${REDIS_CONEXAO:-redis:6379}"
      Seguranca__ApiKey: ${ANTIFRAUDE_API_KEY}
      # Rate limit por API key (janela deslizante de 1 s no Redis; 429 com Retry-After; com o Redis fora, deixa passar).
      LimiteRequisicoes__PorSegundo: ${RATE_LIMIT_POR_SEGUNDO:-100}
      Revisao__PrazoCaso: ${ANTIFRAUDE_PRAZO_REVISAO:-00:30:00}
      <<: *otel
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:8081"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Mantém no Redis o perfil de cada conta (eurobank.contas.eventos, sem inbox: a versão da conta no Redis descarta
  # o repetido). Para reconstruir: apague o Redis e volte o offset do grupo eurobank-antifraude-worker. Também expira
  # os casos vencidos e mede o drift do modelo ativo (tabela medicoes_drift).
  # Espera a API ficar saudável, porque é ela que aplica as migrations do banco do Antifraude.
  antifraude-worker:
    build:
      context: .
      dockerfile: src/Antifraude/EuroBank.Antifraude.Worker/Dockerfile
    depends_on:
      antifraude-api:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Antifraude: "Host=postgres;Port=5432;Database=eurobank_antifraude;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "${REDIS_CONEXAO:-redis:6379}"
      Kafka__BootstrapServers: kafka:29092
      <<: *otel
      # Drift do modelo ativo: PSI das análises das últimas 24 h contra o treino, a cada 5 min (mais curto nos exercícios).
      Drift__Intervalo: ${ANTIFRAUDE_DRIFT_INTERVALO:-00:05:00}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ---------------------------------------------------------------------------------------------------------
  # Web
  # ---------------------------------------------------------------------------------------------------------

  # EuroBank.Web (Blazor Server, MudBlazor) em http://localhost:5500, as funcionalidades web do laboratório: o início
  # e o antifraude (fila de casos em tempo real, decisão, regras, limiares e listas, modelos, simulador e visão geral).
  # Fala com a REST do antifraude pelo servidor (a API key não vai ao navegador) e ouve eurobank.antifraude.eventos num
  # consumer group próprio por instância, sem inbox: o evento só faz a fila recarregar.
  web:
    build:
      context: .
      dockerfile: src/Web/EuroBank.Web/Dockerfile
    ports:
      - "5500:8080"
    depends_on:
      antifraude-api:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Antifraude__Endereco: http://antifraude-api:8080
      Antifraude__ApiKey: ${ANTIFRAUDE_API_KEY}
      Kafka__BootstrapServers: kafka:29092
      # Os links do início abrem no navegador: as portas do host, com as configuráveis vindas do .env.
      Ferramentas__Grafana: http://localhost:${GRAFANA_PORTA:-3000}
      Ferramentas__Prometheus: http://localhost:${PROMETHEUS_PORTA:-9090}
      Ferramentas__Mailpit: http://localhost:${MAILPIT_PORTA_UI:-8025}
      Ferramentas__RedisInsight: http://localhost:${REDISINSIGHT_PORTA:-5540}
      <<: *otel
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Treino do modelo de fraude sob demanda (não sobe no "up"): gera o CSV sintético no volume antifraude-dados (só na
  # primeira vez), junta os rótulos reais do banco do Antifraude, treina, avalia e registra uma versão. A versão nasce
  # Registrada; quem a ativa ou põe em sombra é o analista, pela API do Antifraude.
  #   docker compose --profile treino run --rm antifraude-treino
  #   docker compose --profile treino run --rm antifraude-treino treinar --meta-recall 0.95
  #   docker compose --profile treino run --rm antifraude-treino gerar --semente 7   (outro mundo sintético)
  antifraude-treino:
    build:
      context: .
      dockerfile: src/Antifraude/EuroBank.Antifraude.Treinamento/Dockerfile
    profiles: ["treino"]
    depends_on:
      antifraude-api:
        condition: service_healthy
    # Sem Kerberos no laboratório: a imagem (só o runtime, sem curl) não tem a libgssapi que o Npgsql tentaria carregar.
    environment:
      ConnectionStrings__Antifraude: "Host=postgres;Port=5432;Database=eurobank_antifraude;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Gss Encryption Mode=Disable"
    volumes:
      - antifraude-dados:/app/dados

  # E-mail em pt-BR para quem pediu (emailNotificacao) a partir dos eventos finais das sagas
  # (eurobank.transferencias.eventos), com inbox durável e a tabela notificacoes (chave = id do evento) no database
  # eurobank_notificacoes. SMTP fora do ar: novas tentativas em 5 s, 30 s e 2 min, depois dead letter; a saga não
  # é afetada.
  notificacoes-worker:
    build:
      context: .
      dockerfile: src/Notificacoes/EuroBank.Notificacoes.Worker/Dockerfile
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Notificacoes: "Host=postgres;Port=5432;Database=eurobank_notificacoes;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Kafka__BootstrapServers: kafka:29092
      Smtp__Host: mailpit
      Smtp__Porta: "1025"
      <<: *otel
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Caixa de e-mail do laboratório: SMTP na 1025 (sem TLS e sem autenticação) e UI em http://localhost:8025.
  # A porta SMTP também fica no host para o worker de notificações rodar pela IDE. As duas portas do host mudam
  # por MAILPIT_PORTA_UI e MAILPIT_PORTA_SMTP (outro projeto com Mailpit costuma ocupar 8025 e 1025).
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "${MAILPIT_PORTA_UI:-8025}:8025"
      - "${MAILPIT_PORTA_SMTP:-1025}:1025"
    environment:
      # O padrão guarda só 500 mensagens; a carga do k6 pode passar disso.
      MP_MAX_MESSAGES: "5000"

  # ---------------------------------------------------------------------------------------------------------
  # Simuladores de sistemas de fora do EuroBank (Confluent.Kafka e Npgsql puros, sem Wolverine e sem EF).
  # ---------------------------------------------------------------------------------------------------------

  # Rede SEPA de mentira: liquida, recusa, atrasa ou some conforme o final do IBAN de destino.
  # Database próprio (eurobank_banco_externo), criado pelo simulador na primeira subida.
  banco-externo-simulador:
    build:
      context: .
      dockerfile: src/Simuladores/EuroBank.Simuladores.BancoExterno/Dockerfile
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__BancoExterno: "Host=postgres;Port=5432;Database=eurobank_banco_externo;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Kafka__BootstrapServers: kafka:29092
      BancoExterno__LatenciaMs: ${BANCO_EXTERNO_LATENCIA_MS:-1000}
      BancoExterno__TaxaRecusa: ${BANCO_EXTERNO_TAXA_RECUSA:-0}
      BancoExterno__TaxaSilencio: ${BANCO_EXTERNO_TAXA_SILENCIO:-0}
      BancoExterno__AtrasoFinal95Segundos: ${BANCO_EXTERNO_ATRASO_95:-300}
      BancoExterno__AtrasoDevolucaoSegundos: ${BANCO_EXTERNO_ATRASO_DEVOLUCAO:-10}
      <<: *otel
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Provedor de cotações de mentira: base EUR (1,08 USD, 0,86 GBP, 5,90 BRL), spread de 1%, cotação travada por
  # 10 minutos e o par BRL/GBP indisponível. Database próprio (eurobank_cambio); a cotação válida de cada
  # transferência fica no Redis até vencer, e um reenvio da saga recebe a mesma.
  cambio-simulador:
    build:
      context: .
      dockerfile: src/Simuladores/EuroBank.Simuladores.Cambio/Dockerfile
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Cambio: "Host=postgres;Port=5432;Database=eurobank_cambio;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "${REDIS_CONEXAO:-redis:6379}"
      Kafka__BootstrapServers: kafka:29092
      Cambio__LatenciaMs: ${CAMBIO_LATENCIA_MS:-500}
      Cambio__ValidadeMinutos: ${CAMBIO_VALIDADE_MINUTOS:-10}
      <<: *otel
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ---------------------------------------------------------------------------------------------------------
  # Métricas sob demanda (profile metricas): docker compose --profile metricas up -d
  # ---------------------------------------------------------------------------------------------------------

  # Recebe por push, sem scrape: OTLP das aplicações (/api/v1/otlp/v1/metrics; service.name vira o label job) e
  # remote write do k6 (/api/v1/write). Consultas em http://localhost:9090.
  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: ["metricas"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver
      - --web.enable-remote-write-receiver
      - --storage.tsdb.retention.time=7d
    ports:
      - "${PROMETHEUS_PORTA:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Grafana em http://localhost:3000 (anônimo como Admin, só no laboratório), com o Prometheus como fonte e os
  # dashboards prontos na pasta EuroBank: "Cache do Extrato" e "Antifraude: modelo e drift". O alerta de drift (PSI
  # acima de 0,25) manda e-mail pelo Mailpit para analistas@eurobank.lab.
  grafana:
    image: grafana/grafana:13.2.6
    profiles: ["metricas"]
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "${GRAFANA_PORTA:-3000}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/cache-extrato.json
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: mailpit:1025
      GF_SMTP_FROM_ADDRESS: grafana@eurobank.lab
      GF_SMTP_FROM_NAME: Grafana EuroBank
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Gerador de carga sob demanda (não sobe no "up"). Operações de Contas e sagas misturadas; no fim confere que
  # todas as sagas terminaram e que nenhum dinheiro sumiu. Precisa do corte SEPA desligado na API de Transferencias:
  #   SEPA_HORARIO_DE_CORTE=false docker compose up -d transferencias-api
  #   docker compose --profile carga run --rm k6
  #   K6_VUS=20 K6_DURACAO=2m docker compose --profile carga run --rm k6
  #   K6_FINAIS_LENTOS=true docker compose --profile carga run --rm k6   (inclui os finais 98 e 95)
  k6:
    image: grafana/k6:2.3.0
    profiles: ["carga"]
    depends_on:
      contas-api:
        condition: service_healthy
      extrato-worker:
        condition: service_healthy
      transferencias-api:
        condition: service_healthy
      transferencias-worker:
        condition: service_healthy
    environment:
      API_CONTAS: http://contas-api:8080
      API_EXTRATO: http://extrato-worker:8080
      API_TRANSFERENCIAS: http://transferencias-api:8080
      API_KEY_CONTAS: ${CONTAS_API_KEY}
      API_KEY_EXTRATO: ${EXTRATO_API_KEY}
      API_KEY_TRANSFERENCIAS: ${TRANSFERENCIAS_API_KEY}
      VUS: ${K6_VUS:-10}
      DURACAO: ${K6_DURACAO:-1m}
      CONTAS: ${K6_CONTAS:-10}
      FINAIS_LENTOS: ${K6_FINAIS_LENTOS:-false}
    volumes:
      - ./infra/k6:/scripts:ro
    command: ["run", "/scripts/carga.js"]

  # Comparação das estratégias de cache do Extrato (leitura logo após a escrita), sob demanda. Com o profile
  # metricas no ar, as métricas vão ao Prometheus e aparecem no dashboard "Cache do Extrato"; o roteiro de uma rodada
  # por estratégia está no cabeçalho de infra/k6/cache.js.
  #   docker compose --profile carga run --rm k6-cache
  k6-cache:
    image: grafana/k6:2.3.0
    profiles: ["carga"]
    depends_on:
      contas-api:
        condition: service_healthy
      extrato-worker:
        condition: service_healthy
    environment:
      API_CONTAS: http://contas-api:8080
      API_EXTRATO: http://extrato-worker:8080
      API_KEY_CONTAS: ${CONTAS_API_KEY}
      API_KEY_EXTRATO: ${EXTRATO_API_KEY}
      # A mesma variável que escolhe a estratégia do extrato-worker: a tag das métricas não tem como divergir dela.
      ESTRATEGIA: ${EXTRATO_CACHE_ESTRATEGIA:-WriteThrough}
      VUS: ${K6_VUS:-4}
      DURACAO: ${K6_DURACAO:-1m}
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: "p(50),p(95),p(99),avg"
      K6_PROMETHEUS_RW_PUSH_INTERVAL: 5s
    volumes:
      - ./infra/k6:/scripts:ro
    command: ["run", "-o", "experimental-prometheus-rw", "/scripts/cache.js"]

volumes:
  postgres-dados:
  antifraude-dados:
